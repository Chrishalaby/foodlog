<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>FoodLog</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Snap your meals, review AI nutrition estimates and track your day."
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FoodLog" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180x180.png" />
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('theme');
          var prefersLight =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          if (stored === 'light' || (stored === 'system' && prefersLight)) {
            theme = 'light';
          }
        } catch (e) {
          theme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script>
      (function () {
        var path = location.pathname;
        var notesHost =
          location.hostname.toLowerCase().split('.')[0].split('-').indexOf('notes') !== -1;
        if (!notesHost && path !== '/notes' && path.indexOf('/notes/') !== 0) {
          return;
        }
        var set = function (selector, attribute, value) {
          var element = document.querySelector(selector);
          if (element) {
            element.setAttribute(attribute, value);
          }
        };
        document.title = 'Notes';
        set(
          'link[rel="manifest"]',
          'href',
          notesHost ? 'notes-app.webmanifest' : 'notes.webmanifest',
        );
        set('link[rel="icon"][type="image/svg+xml"]', 'href', 'icons/notes/icon.svg');
        set('link[rel="icon"][type="image/png"]', 'href', 'icons/notes/favicon-32x32.png');
        set('link[rel="apple-touch-icon"]', 'href', 'icons/notes/apple-touch-icon-180x180.png');
        set('meta[name="apple-mobile-web-app-title"]', 'content', 'Notes');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to use FoodLog.</noscript>
  </body>
</html>
